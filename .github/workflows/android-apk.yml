name: Nippon-Drive Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare web and native project
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

            # Keep the committed npm lockfile synchronized when package.json changes.
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Audit catalog
        run: npm run audit:catalog

      - name: Build web assets
        run: npm run build

      - name: Generate Android project once
        if: ${{ !hashFiles('android/gradlew') }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::android/ is missing. Run the workflow on main first to bootstrap and commit the native project."
            exit 1
          fi
          npx cap add android

      - name: Generate Android launcher icons from the original image
        run: |
          mkdir -p assets
          cp public/nippon-drive-icon.png assets/icon.png
          cp public/nippon-drive-icon.png assets/splash.png
          npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync native project
        run: npx cap sync android

      - name: Configure stable package versioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "versionCode 1" in text:
              text = text.replace("versionCode 1", 'versionCode (System.getenv("ANDROID_VERSION_CODE")?.toInteger() ?: 1)', 1)
          elif 'System.getenv("ANDROID_VERSION_CODE")' not in text:
              raise SystemExit("Could not locate Android versionCode in android/app/build.gradle")
          if 'versionName "1.0"' in text:
              text = text.replace('versionName "1.0"', 'versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0")', 1)
          elif "versionName '1.0'" in text:
              text = text.replace("versionName '1.0'", 'versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0")', 1)
          elif 'System.getenv("ANDROID_VERSION_NAME")' not in text:
              raise SystemExit("Could not locate Android versionName in android/app/build.gradle")
          path.write_text(text)
          PY

      # The first main-branch run commits package-lock.json and android/.
      - name: Commit bootstrapped project
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "Lockfile and Android project are already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(android): commit native project and npm lockfile"
            git push origin HEAD:main
          fi

      - name: Upload prepared native project
        uses: actions/upload-artifact@v5
        with:
          name: nippon-drive-native-project
          path: |
            android/
            package-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  debug-apk:
    name: Build debug APK (artifact only)
    needs: prepare
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download prepared native project
        uses: actions/download-artifact@v5
        with:
          name: nippon-drive-native-project
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Nippon-Drive-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create draft unsigned test release with APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Nippon-Drive test build ${{ github.run_number }}
          generate_release_notes: true
          draft: true
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

      # Immutable-release repositories reject asset uploads after publication.
      # Upload the APK to a draft first, then publish only after the asset exists.
      - name: Publish test release after APK upload
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "test-build-${{ github.run_number }}" --json assets --jq '.assets[] | select(.name == "app-debug.apk") | .name' | grep -Fx 'app-debug.apk'
          gh release edit "test-build-${{ github.run_number }}" --draft=false


  release-apk:
    name: Build and publish signed release APK
    needs: prepare
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Download prepared native project
        uses: actions/download-artifact@v5
        with:
          name: nippon-drive-native-project
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nippon-drive-release.jks"
          test -s "$RUNNER_TEMP/nippon-drive-release.jks"

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/nippon-drive-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Nippon-Drive-APK-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nippon-Drive ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
