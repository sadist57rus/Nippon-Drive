name: Download verified vehicle photos

on:
  push:
    branches:
      - assets/vehicle-photo-fetch

permissions:
  contents: write

concurrency:
  group: vehicle-photo-fetch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo batch branch
        uses: actions/checkout@v4
        with:
          ref: assets/vehicle-photo-fetch
          fetch-depth: 0

      - name: Download and validate photo files in parallel
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, json, time

          photos = [
          {
            "filename": "Toyota mr2 sw20 gt-s 1 r.jpg",
            "target": "toyota-mr2-sw20-gt-s.jpg",
            "author": "Toyotacoronaexsaloon",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_mr2_sw20_gt-s_1_r.jpg",
          },
          {
            "filename": "Toyota starlet ep91 glanzav 1 f.jpg",
            "target": "toyota-starlet-ep91-glanza-v.jpg",
            "author": "Toyotacoronaexsaloon",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_starlet_ep91_glanzav_1_f.jpg",
          },
          {
            "filename": "2000 Toyota Caldina GT-T.jpg",
            "target": "toyota-caldina-st215w-gt-t.jpg",
            "author": "Calreyn88",
            "license": "CC BY 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:2000_Toyota_Caldina_GT-T.jpg",
          },
          {
            "filename": "2002 Toyota Crown Athlete V 2.5 Front.jpg",
            "target": "toyota-crown-jzs171-athlete-v.jpg",
            "author": "Vauxford",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:2002_Toyota_Crown_Athlete_V_2.5_Front.jpg",
          },
          {
            "filename": "Toyota CROWN ESTATE ATHLETE V (GH-JZS171W) front.jpg",
            "target": "toyota-crown-estate-jzs171w-athlete-v.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_CROWN_ESTATE_ATHLETE_V_(GH-JZS171W)_front.jpg",
          },
          {
            "filename": "Toyota ALTEZZA RS200 (SXE10) front.JPG",
            "target": "toyota-altezza-sxe10-rs200.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_ALTEZZA_RS200_(SXE10)_front.JPG",
          },
          {
            "filename": "Toyota GH-JZS161 Aristo V300 “VERTEX EDITION” (No.) (24042811473).jpg",
            "target": "toyota-aristo-jzs161-v300.jpg",
            "author": "先従隗始",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_GH-JZS161_Aristo_V300_%E2%80%9CVERTEX_EDITION%E2%80%9D_(No.)_(24042811473).jpg",
          },
          {
            "filename": "1993-1995 Toyota Corolla Levin (AE101) GT Apex coupe 01.jpg",
            "target": "toyota-corolla-levin-ae101-gt-apex.jpg",
            "author": "OSX",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:1993-1995_Toyota_Corolla_Levin_(AE101)_GT_Apex_coupe_01.jpg",
          },
          {
            "filename": "Nissan GF-BNR34 Skyline GT-R V･spec Ⅱ (22091110272).jpg",
            "target": "nissan-skyline-bnr34-v-spec-ii.jpg",
            "author": "先従隗始",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_GF-BNR34_Skyline_GT-R_V%EF%BD%A5spec_%E2%85%A1_(22091110272).jpg",
          },
          {
            "filename": "Nissan Skyline R34 GT-R Nür 001.jpg",
            "target": "nissan-skyline-bnr34-m-spec-nur.jpg",
            "author": "Tennen-Gas",
            "license": "GFDL 1.2+ / CC BY-SA 3.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_Skyline_R34_GT-R_N%C3%BCr_001.jpg",
          },
          ]

          destination = Path("public/assets/vehicles")
          destination.mkdir(parents=True, exist_ok=True)

          def fetch_one(item):
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + quote(item["filename"], safe="") + "?width=1200"
              payload = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers={"User-Agent": "Nippon-Drive vehicle-photo catalog/1.0 (offline app asset import)"})
                      with urlopen(request, timeout=60) as response:
                          payload = response.read()
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))
              if len(payload) < 12000:
                  raise RuntimeError(f"{item['filename']}: response too small ({len(payload)} bytes)")
              image = Image.open(io.BytesIO(payload))
              image.verify()
              image = Image.open(io.BytesIO(payload)).convert("RGB")
              if image.width < 640 or image.height < 300:
                  raise RuntimeError(f"{item['filename']}: insufficient dimensions {image.size}")
              output = destination / item["target"]
              image.save(output, "JPEG", quality=88, optimize=True, progressive=True)
              item["width"], item["height"] = image.size
              item["bytes"] = output.stat().st_size
              return item["target"], item["width"], item["height"], item["bytes"]

          errors = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(fetch_one, item): item for item in photos}
              for future in as_completed(futures):
                  item = futures[future]
                  try:
                      print("DOWNLOADED", future.result())
                      item["downloadStatus"] = "downloaded"
                  except Exception as exc:
                      item["downloadStatus"] = "failed"
                      item["downloadError"] = str(exc)
                      errors.append(str(exc))
                      print("DOWNLOAD_ERROR", item["filename"], repr(exc))

          (destination / "sources-batch-06.json").write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Downloaded {sum(item.get('downloadStatus') == 'downloaded' for item in photos)} of {len(photos)} image files.")
          if errors:
              print("Some sources need retry: " + " | ".join(errors))
          PY

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vehicles/
          git commit -m "assets: загрузить фото японских спорткаров и седанов — пакет 5"
          git push origin HEAD:assets/vehicle-photo-fetch
