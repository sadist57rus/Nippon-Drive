name: Download verified vehicle photos

on:
  push:
    branches:
      - assets/vehicle-photo-fetch

permissions:
  contents: write

concurrency:
  group: vehicle-photo-fetch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo batch branch
        uses: actions/checkout@v4
        with:
          ref: assets/vehicle-photo-fetch
          fetch-depth: 0

      - name: Download and validate photo files in parallel
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, json, time

          photos = [
          {
            "filename": "Mitsubishi Pajero (V80) front.jpg",
            "target": "mitsubishi-pajero-v80.jpg",
            "author": "M 93",
            "license": "GFDL 1.2+ / CC BY-SA 3.0",
            "source": "https://commons.wikimedia.org/wiki/File:Mitsubishi_Pajero_(V80)_front.jpg",
          },
          {
            "filename": "04-05 Mitsubishi Lancer sedan.jpg",
            "target": "mitsubishi-lancer-ix-cs-sedan.jpg",
            "author": "IFCAR",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:04-05_Mitsubishi_Lancer_sedan.jpg",
          },
          {
            "filename": "Mitsubishi Pajero Sport III.jpg",
            "target": "mitsubishi-pajero-sport-iii.jpg",
            "author": "RL GNZLZ",
            "license": "CC BY-SA 2.0",
            "source": "https://commons.wikimedia.org/wiki/File:Mitsubishi_Pajero_Sport_III.jpg",
          },
          {
            "filename": "Nissan Patrol Y61.jpg",
            "target": "nissan-patrol-y61.jpg",
            "author": "Alekc2m",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_Patrol_Y61.jpg",
          },
          {
            "filename": "Suzuki Grand Vitara 2.4 GLX Sport 2014 (33343530282).jpg",
            "target": "suzuki-grand-vitara-jt.jpg",
            "author": "RL GNZLZ",
            "license": "CC BY-SA 2.0",
            "source": "https://commons.wikimedia.org/wiki/File:Suzuki_Grand_Vitara_2.4_GLX_Sport_2014_(33343530282).jpg",
          },
          {
            "filename": "Honda CRV 3 front 20071106.jpg",
            "target": "honda-crv-re-third-gen.jpg",
            "author": "Rudolf Stricker",
            "license": "GFDL 1.2+ / CC BY-SA 3.0",
            "source": "https://commons.wikimedia.org/wiki/File:Honda_CRV_3_front_20071106.jpg",
          },
          {
            "filename": "Toyota Rav4 XA30 01 China 2012-04-22.jpg",
            "target": "toyota-rav4-xa30.jpg",
            "author": "Navigator84",
            "license": "CC BY-SA 3.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_Rav4_XA30_01_China_2012-04-22.jpg",
          },
          {
            "filename": "Toyota Camry SE XV40.JPG",
            "target": "toyota-camry-xv40.jpg",
            "author": "Bull-Doser",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_Camry_SE_XV40.JPG",
          },
          {
            "filename": "Infiniti FX35 (S51) front.jpg",
            "target": "infiniti-fx35-s51.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Infiniti_FX35_(S51)_front.jpg",
          },
          {
            "filename": "Daihatsu Terios (J200) 164951260.jpg",
            "target": "daihatsu-terios-j200.jpg",
            "author": "Trop86",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Daihatsu_Terios_(J200)_164951260.jpg",
          },
          ]

          destination = Path("public/assets/vehicles")
          destination.mkdir(parents=True, exist_ok=True)

          def fetch_one(item):
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + quote(item["filename"], safe="") + "?width=1200"
              payload = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers={"User-Agent": "Nippon-Drive vehicle-photo catalog/1.0 (offline app asset import)"})
                      with urlopen(request, timeout=60) as response:
                          payload = response.read()
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))
              if len(payload) < 12000:
                  raise RuntimeError(f"{item['filename']}: response too small ({len(payload)} bytes)")
              image = Image.open(io.BytesIO(payload))
              image.verify()
              image = Image.open(io.BytesIO(payload)).convert("RGB")
              if image.width < 640 or image.height < 300:
                  raise RuntimeError(f"{item['filename']}: insufficient dimensions {image.size}")
              output = destination / item["target"]
              image.save(output, "JPEG", quality=88, optimize=True, progressive=True)
              item["width"], item["height"] = image.size
              item["bytes"] = output.stat().st_size
              return item["target"], item["width"], item["height"], item["bytes"]

          errors = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(fetch_one, item): item for item in photos}
              for future in as_completed(futures):
                  item = futures[future]
                  try:
                      print("DOWNLOADED", future.result())
                      item["downloadStatus"] = "downloaded"
                  except Exception as exc:
                      item["downloadStatus"] = "failed"
                      item["downloadError"] = str(exc)
                      errors.append(str(exc))
                      print("DOWNLOAD_ERROR", item["filename"], repr(exc))

          (destination / "sources-batch-07.json").write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Downloaded {sum(item.get('downloadStatus') == 'downloaded' for item in photos)} of {len(photos)} image files.")
          if errors:
              print("Some sources need retry: " + " | ".join(errors))
          PY

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vehicles/
          git commit -m "assets: загрузить фото японских спорткаров и седанов — пакет 5"
          git push origin HEAD:assets/vehicle-photo-fetch
