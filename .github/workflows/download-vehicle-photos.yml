name: Download verified vehicle photos

on:
  push:
    branches:
      - assets/vehicle-photo-fetch

permissions:
  contents: write

concurrency:
  group: vehicle-photo-fetch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo batch branch
        uses: actions/checkout@v4
        with:
          ref: assets/vehicle-photo-fetch
          fetch-depth: 0

      - name: Download and validate photo files in parallel
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, json, time

          photos = [
          {
            "filename": "Toyota Mark II Tourer V (JZX90).jpg",
            "target": "toyota-mark-ii-x90-tourer-v.jpg",
            "author": "Mld61294",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_Mark_II_Tourer_V_(JZX90).jpg",
          },
          {
            "filename": "Toyota GF-JZX100 Mark Ⅱ 2.5 TOURER V (24033010401).jpg",
            "target": "toyota-mark-ii-x100-tourer-v.jpg",
            "author": "先従隗始",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_GF-JZX100_Mark_Ⅱ_2.5_TOURER_V_(24033010401).jpg",
          },
          {
            "filename": "Toyota Chaser Tourer V.jpg",
            "target": "toyota-chaser-x100-tourer-v.jpg",
            "author": "FotoSleuth (uploaded by OSX)",
            "license": "CC BY 2.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_Chaser_Tourer_V.jpg",
          },
          {
            "filename": "Nissan GF-S15 Silvia spec. S - Toyota E-JZX90 Chaser 2.5 Tourer V (23011710160).jpg",
            "target": "toyota-chaser-x90-tourer-v.jpg",
            "author": "先従隗始",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_GF-S15_Silvia_spec._S_-_Toyota_E-JZX90_Chaser_2.5_Tourer_V_(23011710160).jpg",
          },
          {
            "filename": "Toyota GF-JZX100 Cresta 2.5 Roulant G - Honda ABA-CL9 Accord 24TL (23060415233).jpg",
            "target": "toyota-cresta-x100-roulant-g.jpg",
            "author": "先従隗始",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_GF-JZX100_Cresta_2.5_Roulant_G_-_Honda_ABA-CL9_Accord_24TL_(23060415233).jpg",
          },
          {
            "filename": "Toyota Supra RZ (E-JZA80).jpg",
            "target": "toyota-supra-a80-rz.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_Supra_RZ_(E-JZA80).jpg",
          },
          {
            "filename": "1989 Toyota A70 Supra MkIII 3.0 GT Turbo.jpg",
            "target": "toyota-supra-a70-gt-turbo.jpg",
            "author": "Sicnag",
            "license": "CC BY 2.0",
            "source": "https://commons.wikimedia.org/wiki/File:1989_Toyota_A70_Supra_MkIII_3.0_GT_Turbo.jpg",
          },
          {
            "filename": "1992 Toyota Soarer 2.5GT Twin Turbo.jpg",
            "target": "toyota-soarer-jzz30-gt-twin-turbo.jpg",
            "author": "TTTNIS",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:1992_Toyota_Soarer_2.5GT_Twin_Turbo.jpg",
          },
          {
            "filename": "1988-1990 Nissan Cefiro (A31) sedan 01.jpg",
            "target": "nissan-cefiro-a31-rb20det.jpg",
            "author": "OSX",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:1988-1990_Nissan_Cefiro_(A31)_sedan_01.jpg",
          },
          {
            "filename": "Nissan laurel hc33 medalist 1 f.jpg",
            "target": "nissan-laurel-c33-rb20-medalist.jpg",
            "author": "Toyotacoronaexsaloon",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_laurel_hc33_medalist_1_f.jpg",
          },
          ]

          destination = Path("public/assets/vehicles")
          destination.mkdir(parents=True, exist_ok=True)

          def fetch_one(item):
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + quote(item["filename"], safe="") + "?width=1200"
              payload = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers={"User-Agent": "Nippon-Drive vehicle-photo catalog/1.0 (offline app asset import)"})
                      with urlopen(request, timeout=60) as response:
                          payload = response.read()
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))
              if len(payload) < 12000:
                  raise RuntimeError(f"{item['filename']}: response too small ({len(payload)} bytes)")
              image = Image.open(io.BytesIO(payload))
              image.verify()
              image = Image.open(io.BytesIO(payload)).convert("RGB")
              if image.width < 640 or image.height < 300:
                  raise RuntimeError(f"{item['filename']}: insufficient dimensions {image.size}")
              output = destination / item["target"]
              image.save(output, "JPEG", quality=88, optimize=True, progressive=True)
              item["width"], item["height"] = image.size
              item["bytes"] = output.stat().st_size
              return item["target"], item["width"], item["height"], item["bytes"]

          errors = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(fetch_one, item): item for item in photos}
              for future in as_completed(futures):
                  item = futures[future]
                  try:
                      print("DOWNLOADED", future.result())
                      item["downloadStatus"] = "downloaded"
                  except Exception as exc:
                      item["downloadStatus"] = "failed"
                      item["downloadError"] = str(exc)
                      errors.append(str(exc))
                      print("DOWNLOAD_ERROR", item["filename"], repr(exc))

          (destination / "sources-batch-05.json").write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Downloaded {sum(item.get('downloadStatus') == 'downloaded' for item in photos)} of {len(photos)} image files.")
          if errors:
              print("Some sources need retry: " + " | ".join(errors))
          PY

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vehicles/
          git commit -m "assets: загрузить фото JDM икон и спорткаров — пакет 4"
          git push origin HEAD:assets/vehicle-photo-fetch
