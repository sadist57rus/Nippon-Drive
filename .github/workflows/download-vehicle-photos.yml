name: Download verified vehicle photos

on:
  push:
    branches:
      - assets/vehicle-photo-fetch

permissions:
  contents: write

concurrency:
  group: vehicle-photo-fetch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo batch branch
        uses: actions/checkout@v4
        with:
          ref: assets/vehicle-photo-fetch
          fetch-depth: 0

      - name: Download and validate photo files in parallel
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, json

          photos = [
  {
    "filename": "E120 Toyota Corolla.jpg",
    "target": "toyota-corolla-e120.jpg",
    "author": "Kuha455405",
    "license": "CC BY-SA 3.0 / GFDL 1.2+",
    "source": "https://commons.wikimedia.org/wiki/File:E120_Toyota_Corolla.jpg",
  },
  {
    "filename": "Mazda 3 BK.jpg",
    "target": "mazda3-bk-sedan.jpg",
    "author": "Krzysztof Masloch",
    "license": "CC BY-SA 3.0",
    "source": "https://commons.wikimedia.org/wiki/File:Mazda_3_BK.jpg",
  },
  {
    "filename": "2005 Nissan Note 01.jpg",
    "target": "nissan-note-e11.jpg",
    "author": "Mytho88",
    "license": "CC BY-SA 3.0 / GFDL 1.2+",
    "source": "https://commons.wikimedia.org/wiki/File:2005_Nissan_Note_01.jpg",
  },
  {
    "filename": "Toyota camry acv30 2.4g 1 f.jpg",
    "target": "toyota-camry-xv30.jpg",
    "author": "Toyotacoronaexsaloon",
    "license": "CC BY-SA 4.0",
    "source": "https://commons.wikimedia.org/wiki/File:Toyota_camry_acv30_2.4g_1_f.jpg",
  },
  {
    "filename": "NISSAN SERENA C25.jpg",
    "target": "nissan-serena-c25.jpg",
    "author": "TTTNIS",
    "license": "Public domain (author release)",
    "source": "https://commons.wikimedia.org/wiki/File:NISSAN_SERENA_C25.jpg",
  },
  {
    "filename": "Nissan Tiida (C11) hatchback.png",
    "target": "nissan-tiida-c11-hatchback.jpg",
    "author": "SSJF01",
    "license": "CC0 1.0",
    "source": "https://commons.wikimedia.org/wiki/File:Nissan_Tiida_(C11)_hatchback.png",
  },
  {
    "filename": "TOYOTA PRIUS (XW30) China.jpg",
    "target": "toyota-prius-xw30.jpg",
    "author": "Dinkun Chen",
    "license": "CC BY-SA 4.0",
    "source": "https://commons.wikimedia.org/wiki/File:TOYOTA_PRIUS_(XW30)_China.jpg",
  },
  {
    "filename": "Toyota H-200 HiAce.jpg",
    "target": "toyota-hiace-h200.jpg",
    "author": "Bull-Doser",
    "license": "Public domain (author release)",
    "source": "https://commons.wikimedia.org/wiki/File:Toyota_H-200_HiAce.jpg",
  },
  {
    "filename": "2012 Mazda CX-5 (KE) Grand Touring wagon (2012-10-26) 01.jpg",
    "target": "mazda-cx5-ke.jpg",
    "author": "OSX",
    "license": "Public domain (author release)",
    "source": "https://commons.wikimedia.org/wiki/File:2012_Mazda_CX-5_(KE)_Grand_Touring_wagon_(2012-10-26)_01.jpg",
  },
  {
    "filename": "White Toyota Vitz (XP90).jpg",
    "target": "toyota-vitz-xp90.jpg",
    "author": "arakaki",
    "license": "Public domain (author release)",
    "source": "https://commons.wikimedia.org/wiki/File:White_Toyota_Vitz_(XP90).jpg",
  },
          ]

          destination = Path("public/assets/vehicles")
          destination.mkdir(parents=True, exist_ok=True)

          def fetch_one(item):
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + quote(item["filename"], safe="") + "?width=1600"
              request = Request(url, headers={"User-Agent": "Nippon-Drive vehicle-photo catalog/1.0 (offline app asset import)"})
              with urlopen(request, timeout=60) as response:
                  payload = response.read()
              if len(payload) < 12000:
                  raise RuntimeError(f"{item['filename']}: response too small ({len(payload)} bytes)")
              image = Image.open(io.BytesIO(payload))
              image.verify()
              image = Image.open(io.BytesIO(payload)).convert("RGB")
              if image.width < 640 or image.height < 300:
                  raise RuntimeError(f"{item['filename']}: insufficient dimensions {image.size}")
              output = destination / item["target"]
              image.save(output, "JPEG", quality=88, optimize=True, progressive=True)
              item["width"], item["height"] = image.size
              item["bytes"] = output.stat().st_size
              return item["target"], item["width"], item["height"], item["bytes"]

          errors = []
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(fetch_one, item) for item in photos]
              for future in as_completed(futures):
                  try:
                      print("DOWNLOADED", future.result())
                  except Exception as exc:
                      errors.append(str(exc))
          if errors:
              raise SystemExit("Photo download batch failed:\n" + "\n".join(errors))

          (destination / "sources-batch-02.json").write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Validated {len(photos)} image files.")
          PY

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vehicles/
          git commit -m "assets: добавить реальные фото автомобилей — пакет 1"
          git push origin HEAD:assets/vehicle-photo-fetch
