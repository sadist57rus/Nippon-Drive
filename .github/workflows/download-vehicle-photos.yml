name: Download verified vehicle photos

on:
  push:
    branches:
      - assets/vehicle-photo-fetch

permissions:
  contents: write

concurrency:
  group: vehicle-photo-fetch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo batch branch
        uses: actions/checkout@v4
        with:
          ref: assets/vehicle-photo-fetch
          fetch-depth: 0

      - name: Download and validate photo files in parallel
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, json, time

          photos = [
          {
            "filename": "2019 Mazda3 Hatchback 2.0 BP (20191219) 01.jpg",
            "target": "mazda3-bp-fastback.jpg",
            "author": "オーバードライブ83",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:2019_Mazda3_Hatchback_2.0_BP_(20191219)_01.jpg",
          },
          {
            "filename": "2019 Mazda 3 Sedan 2.0 SkyActiv-G High Plus (1).jpg",
            "target": "mazda3-bp-sedan.jpg",
            "author": "Bindydad123",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:2019_Mazda_3_Sedan_2.0_SkyActiv-G_High_Plus_(1).jpg",
          },
          {
            "filename": "2007 Mazda MPV 2.3 Front.jpg",
            "target": "mazda-mpv-ly3p.jpg",
            "author": "Vauxford",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:2007_Mazda_MPV_2.3_Front.jpg",
          },
          {
            "filename": "Toyota Corolla Coupe Levin AE86.jpg",
            "target": "toyota-corolla-levin-ae86.jpg",
            "author": "crash71100",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Toyota_Corolla_Coupe_Levin_AE86.jpg",
          },
          {
            "filename": "1997-2000 Toyota Corolla Levin (AE111) BZ-R coupe 02.jpg",
            "target": "toyota-corolla-levin-ae111.jpg",
            "author": "OSX",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:1997-2000_Toyota_Corolla_Levin_(AE111)_BZ-R_coupe_02.jpg",
          },
          {
            "filename": "Nissan CUBE PREMIUM (Z10) front.JPG",
            "target": "nissan-cube-z10.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_CUBE_PREMIUM_(Z10)_front.JPG",
          },
          {
            "filename": "Nissan Cube Z11 (2003).jpg",
            "target": "nissan-cube-z11.jpg",
            "author": "Andrew Bone",
            "license": "CC BY 2.0",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_Cube_Z11_(2003).jpg",
          },
          {
            "filename": "Nissan Cube (Z12) – Frontansicht, 12. März 2011, Düsseldorf.jpg",
            "target": "nissan-cube-z12.jpg",
            "author": "M 93",
            "license": "Attribution only (Commons permission statement)",
            "source": "https://commons.wikimedia.org/wiki/File:Nissan_Cube_(Z12)_%E2%80%93_Frontansicht,_12._M%C3%A4rz_2011,_D%C3%BCsseldorf.jpg",
          },
          {
            "filename": "2000-2003 Toyota bB in Black, front left.jpg",
            "target": "toyota-bb-ncp30.jpg",
            "author": "Mr.choppers",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:2000-2003_Toyota_bB_in_Black,_front_left.jpg",
          },
          {
            "filename": "The frontview of Toyota bB (QNC20) with body lowered.JPG",
            "target": "toyota-bb-qnc20.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:The_frontview_of_Toyota_bB_(QNC20)_with_body_lowered.JPG",
          },
          ]

          destination = Path("public/assets/vehicles")
          destination.mkdir(parents=True, exist_ok=True)

          def fetch_one(item):
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + quote(item["filename"], safe="") + "?width=1200"
              payload = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers={"User-Agent": "Nippon-Drive vehicle-photo catalog/1.0 (offline app asset import)"})
                      with urlopen(request, timeout=60) as response:
                          payload = response.read()
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))
              if len(payload) < 12000:
                  raise RuntimeError(f"{item['filename']}: response too small ({len(payload)} bytes)")
              image = Image.open(io.BytesIO(payload))
              image.verify()
              image = Image.open(io.BytesIO(payload)).convert("RGB")
              if image.width < 640 or image.height < 300:
                  raise RuntimeError(f"{item['filename']}: insufficient dimensions {image.size}")
              output = destination / item["target"]
              image.save(output, "JPEG", quality=88, optimize=True, progressive=True)
              item["width"], item["height"] = image.size
              item["bytes"] = output.stat().st_size
              return item["target"], item["width"], item["height"], item["bytes"]

          errors = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(fetch_one, item): item for item in photos}
              for future in as_completed(futures):
                  item = futures[future]
                  try:
                      print("DOWNLOADED", future.result())
                      item["downloadStatus"] = "downloaded"
                  except Exception as exc:
                      item["downloadStatus"] = "failed"
                      item["downloadError"] = str(exc)
                      errors.append(str(exc))
                      print("DOWNLOAD_ERROR", item["filename"], repr(exc))

          (destination / "sources-batch-10.json").write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Downloaded {sum(item.get('downloadStatus') == 'downloaded' for item in photos)} of {len(photos)} image files.")
          if errors:
              print("Some sources need retry: " + " | ".join(errors))
          PY

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vehicles/
          git commit -m "assets: загрузить фото японских спорткаров и седанов — пакет 5"
          git push origin HEAD:assets/vehicle-photo-fetch
