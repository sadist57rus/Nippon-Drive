name: Download verified vehicle photos

on:
  push:
    branches:
      - assets/vehicle-photo-fetch

permissions:
  contents: write

concurrency:
  group: vehicle-photo-fetch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo batch branch
        uses: actions/checkout@v4
        with:
          ref: assets/vehicle-photo-fetch
          fetch-depth: 0

      - name: Download and validate photo files in parallel
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, json, time

          photos = [
          {
            "filename": "2006 Toyota Corolla-Fielder 03.jpg",
            "target": "toyota-corolla-fielder-e140.jpg",
            "author": "Mytho88",
            "license": "GFDL 1.2+ / CC BY-SA 3.0",
            "source": "https://commons.wikimedia.org/wiki/File:2006_Toyota_Corolla-Fielder_03.jpg",
          },
          {
            "filename": "Honda CIVIC 1.8GL (DBA-FD1) front.jpg",
            "target": "honda-civic-fd1-sedan.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC BY-SA 4.0",
            "source": "https://commons.wikimedia.org/wiki/File:Honda_CIVIC_1.8GL_(DBA-FD1)_front.jpg",
          },
          {
            "filename": "2008 Honda Civic hatchback in Galaxy Grey, front left, 06-05-2025.jpg",
            "target": "honda-civic-fn-hatchback.jpg",
            "author": "Cutlass",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:2008_Honda_Civic_hatchback_in_Galaxy_Grey,_front_left,_06-05-2025.jpg",
          },
          {
            "filename": "2008 Subaru Impreza sedan.jpg",
            "target": "subaru-impreza-ge-sedan.jpg",
            "author": "IFCAR",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:2008_Subaru_Impreza_sedan.jpg",
          },
          {
            "filename": "2008 Subaru Impreza Hatchback.jpg",
            "target": "subaru-impreza-gh-hatchback.jpg",
            "author": "Bull-Doser",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:2008_Subaru_Impreza_Hatchback.jpg",
          },
          {
            "filename": "Tuned Suzuki SWIFT (ZC11S) front.JPG",
            "target": "suzuki-swift-zc11s.jpg",
            "author": "Tokumeigakarinoaoshima",
            "license": "CC0 1.0",
            "source": "https://commons.wikimedia.org/wiki/File:Tuned_Suzuki_SWIFT_(ZC11S)_front.JPG",
          },
          {
            "filename": "Lexus IS250 front-1.JPG",
            "target": "lexus-is-xe20.jpg",
            "author": "M 93",
            "license": "CC BY-SA 3.0",
            "source": "https://commons.wikimedia.org/wiki/File:Lexus_IS250_front-1.JPG",
          },
          {
            "filename": "Infiniti G sedan.jpg",
            "target": "infiniti-g-v36-sedan.jpg",
            "author": "IFCAR",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:Infiniti_G_sedan.jpg",
          },
          {
            "filename": "1999-2002 Mazda MPV (LW) van 01.jpg",
            "target": "mazda-mpv-lw.jpg",
            "author": "OSX",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:1999-2002_Mazda_MPV_(LW)_van_01.jpg",
          },
          {
            "filename": "NISSAN MARCH K12.jpg",
            "target": "nissan-march-k12.jpg",
            "author": "TTTNIS",
            "license": "Public domain (author release)",
            "source": "https://commons.wikimedia.org/wiki/File:NISSAN_MARCH_K12.jpg",
          },
          ]

          destination = Path("public/assets/vehicles")
          destination.mkdir(parents=True, exist_ok=True)

          def fetch_one(item):
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + quote(item["filename"], safe="") + "?width=1200"
              payload = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers={"User-Agent": "Nippon-Drive vehicle-photo catalog/1.0 (offline app asset import)"})
                      with urlopen(request, timeout=60) as response:
                          payload = response.read()
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))
              if len(payload) < 12000:
                  raise RuntimeError(f"{item['filename']}: response too small ({len(payload)} bytes)")
              image = Image.open(io.BytesIO(payload))
              image.verify()
              image = Image.open(io.BytesIO(payload)).convert("RGB")
              if image.width < 640 or image.height < 300:
                  raise RuntimeError(f"{item['filename']}: insufficient dimensions {image.size}")
              output = destination / item["target"]
              image.save(output, "JPEG", quality=88, optimize=True, progressive=True)
              item["width"], item["height"] = image.size
              item["bytes"] = output.stat().st_size
              return item["target"], item["width"], item["height"], item["bytes"]

          errors = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(fetch_one, item): item for item in photos}
              for future in as_completed(futures):
                  item = futures[future]
                  try:
                      print("DOWNLOADED", future.result())
                      item["downloadStatus"] = "downloaded"
                  except Exception as exc:
                      item["downloadStatus"] = "failed"
                      item["downloadError"] = str(exc)
                      errors.append(str(exc))
                      print("DOWNLOAD_ERROR", item["filename"], repr(exc))

          (destination / "sources-batch-09.json").write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Downloaded {sum(item.get('downloadStatus') == 'downloaded' for item in photos)} of {len(photos)} image files.")
          if errors:
              print("Some sources need retry: " + " | ".join(errors))
          PY

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vehicles/
          git commit -m "assets: загрузить фото японских спорткаров и седанов — пакет 5"
          git push origin HEAD:assets/vehicle-photo-fetch
