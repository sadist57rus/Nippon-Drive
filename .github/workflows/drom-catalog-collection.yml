name: Drom catalogue source collection

on:
  push:
    branches:
      - feature/drom-technical-scraper
  workflow_dispatch:
    inputs:
      source:
        description: Collection mode
        required: true
        type: choice
        options:
          - sitemap-inventory
          - html-samples
        default: sitemap-inventory

permissions:
  contents: read

concurrency:
  group: drom-catalog-source-collection-v3
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Discover public Drom catalogue URLs
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, 'test:')) || inputs.source == 'sitemap-inventory'
        env:
          DROM_MAX_SITEMAPS: 50
        run: npx --yes tsx scripts/collectDromCatalog.ts
      - name: Capture bounded public HTML samples
        if: github.event_name == 'push' || inputs.source == 'html-samples'
        run: npx --yes tsx scripts/captureDromHtmlSamples.ts
      - name: Test Drom HTML parser
        if: github.event_name == 'push' || inputs.source == 'html-samples'
        run: npx --yes tsx scripts/testDromCatalogParser.ts
      - name: Parse Drom modification rows
        if: github.event_name == 'push' || inputs.source == 'html-samples'
        run: npx --yes tsx scripts/parseDromHtmlSamples.ts
      - name: Collect bounded Japanese modification pages
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'test:')
        run: npx --yes tsx scripts/collectDromTechnicalBatch.ts
      - name: Upload source inventory and samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drom-catalog-${{ inputs.source || 'html-samples' }}
          path: artifacts/drom-catalog/
          if-no-files-found: warn
          retention-days: 14
