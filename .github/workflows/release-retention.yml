name: Retain latest five releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-retention.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep only the five newest test builds
    runs-on: ubuntu-latest
    steps:
      - name: Remove older test-build releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t old_tags < <(
            gh api --paginate "repos/${GH_REPO}/releases?per_page=100" |
              jq -s 'add | map(select(.draft == false and (.tag_name | startswith("test-build-")))) | sort_by(.published_at // .created_at) | reverse | .[5:][] | .tag_name' -r
          )

          if (( ${#old_tags[@]} == 0 )); then
            echo "Five or fewer published test builds found; nothing to remove."
            exit 0
          fi

          echo "Releases to remove: ${#old_tags[@]}"
          for tag in "${old_tags[@]}"; do
            echo "Deleting release and tag: ${tag}"
            gh release delete "${tag}" --cleanup-tag --yes
          done
